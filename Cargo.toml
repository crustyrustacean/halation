[package]
name = "halation"
version = "0.14.2"
edition = "2024"
authors = ["Jeffery D. Mitchell", "<crusty.rustacean@gmail.com>"]
description = "An early-Instagram-style photo sharing server — chronological, calm, and ad-free"
readme = "README.md"
repository = "https://github.com/crustyrustacean/halation.git"
license = "MIT"
publish = false

[[bin]]
name = "halation"
path = "src/bin/main.rs"

[[bin]]
name = "backfill_media_keys"
path = "src/bin/backfill_media_keys.rs"

[dependencies]
actix-cors = "0.7"
actix-files = "0.7"
actix-identity = "0.9"
actix-multipart = { version = "0.8", features = ["tempfile"] }
actix-session = { version = "0.11", features = ["cookie-session"] }
actix-web = "4"
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
dotenvy = "0.15"
sha2 = "0.10"
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
config = { version = "0.15", default-features = false, features = ["yaml"] }
datastar = { git = "https://github.com/crustyrustacean/datastar-rust.git", branch = "feat/actix-adapter", features = ["actix"] }
flux-limiter = "0.8"
heic = "0.1"
image = "0.25"
kamadak-exif = "0.6"
log = "0.4"
opendal = { version = "0.58", features = ["services-fs", "services-s3"] }
secrecy = { version = "0.10", features = ["serde"] }
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde-aux = "4"
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
    "tls-rustls",
    "runtime-tokio",
    "macros",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
] }
tera = { version = "2", features = ["fast", "glob_fs"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-actix-web = "0.7"
tracing-log = "0.2"
tracing-bunyan-formatter = "0.3"
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
reqwest = { version = "0.13", features = ["json", "cookies", "form", "multipart"] }

# ---- workspace: `xtask` holds the dev-side automation so the release and
# deploy mechanics speak one dialect on every platform. See xtask/README.md.
[workspace]
members = ["xtask"]
