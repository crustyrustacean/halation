[package]
name = "halation"
version = "0.15.1"
edition = "2024"
authors = ["Jeffery D. Mitchell", "<crusty.rustacean@gmail.com>"]
description = "An early-Instagram-style photo sharing server — chronological, calm, and ad-free"
readme = "README.md"
repository = "https://github.com/crustyrustacean/halation.git"
license = "MIT"
publish = false

[[bin]]
name = "halation"
path = "src/bin/main.rs"

[[bin]]
name = "backfill_media_keys"
path = "src/bin/backfill_media_keys.rs"

[dependencies]
actix-files = "0.7"
actix-identity = "0.10"
actix-multipart = { version = "0.8", features = ["tempfile"] }
actix-session = { version = "0.12", features = ["cookie-session"] }
actix-sse = "0.3"
actix-web = { version = "4", default-features = false, features = [
    "macros",
    "compress-brotli",
    "compress-gzip",
    "compress-zstd",
    "cookies",
    "unicode",
] }
anyhow = "1"
argon2 = "0.6"
dotenvy = "0.15"
sha2 = "0.11"
async-trait = "0.1"
bytes = "1"
confik = { version = "0.15", features = ["secrecy"] }
datastar = { version = "0.4", features = ["actix-web"] }
flux-limiter = "0.9"
heic = "0.1"
image = "0.25"
jiff = "1"
kamadak-exif = "0.6"
opendal = { version = "0.59", features = ["services-fs", "services-s3"] }
secrecy = { version = "0.10", features = ["serde"] }
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "macros",
    "sqlite",
    "uuid",
    "migrate",
] }
tera = { version = "2", features = ["fast", "glob_fs"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-actix-web = "0.7"
tracing-log = "0.2"
tracing-bunyan-formatter = "0.3"
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
reqwest = { version = "0.13", features = ["json", "cookies", "form", "multipart"] }

# ---- workspace: `xtask` holds the dev-side automation so the release and
# deploy mechanics speak one dialect on every platform. See xtask/README.md.
[workspace]
members = ["xtask"]
