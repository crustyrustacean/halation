<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="/static/screen.css" media="screen">
    <script type="module" src="/static/datastar.js"></script>
    <title>Halation | {{ title }}</title>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="/">Hala<span class="dot">tion</span></a>
            <nav>
                <a href="/">Feed</a>
                <a href="/recent">Recent</a>
                {% if logged_in | default(value=false) %}
                <a href="/upload">Upload</a>
                <form method="post" action="/logout" class="inline-form"><button type="submit" class="link-button">Log out</button></form>
                {% else %}
                <a href="/login">Log in</a>
                {% if site.registration_open | default(value=true) %}
                <a href="/register">Register</a>
                {% endif %}
                {% endif %}
            </nav>
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer class="site-foot">
        Halation — chronological, calm, ad-free.
    </footer>
</body>
</html>
