{% extends "base.html" %}

{% block content %}
<section class="auth">
    {% if errors | length > 0 %}
    <ul class="errors">
        {% for error in errors %}<li>{{ error }}</li>{% endfor %}
    </ul>
    {% endif %}

    <form method="post" action="/upload" enctype="multipart/form-data" class="stack">
        <label>Photos (up to 4)
            <input type="file" name="files" accept="image/jpeg,image/png,image/webp,image/heic" multiple required>
        </label>
        <label>Caption
            <textarea name="caption" rows="3" maxlength="1000"
                      placeholder="What was the light doing?"></textarea>
        </label>
        <button type="submit">Post</button>
    </form>
</section>
{% endblock %}
