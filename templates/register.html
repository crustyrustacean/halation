{% extends "base.html" %}

{% block content %}
<section class="card">
    <h1 class="card-title">Create your account.</h1>
    {% if errors | length > 0 %}
    <ul class="errors">
        {% for error in errors %}<li>{{ error }}</li>{% endfor %}
    </ul>
    {% endif %}

    <form method="post" action="/register" class="stack">
        <label>Username
            <input type="text" name="username" value="{{ username | default(value='') }}" required
                   minlength="3" maxlength="30" autocomplete="username">
        </label>
        <label>Email
            <input type="email" name="email" value="{{ email | default(value='') }}" required autocomplete="email">
        </label>
        <label>Password
            <input type="password" name="password" required minlength="8" autocomplete="new-password">
        </label>
        <button type="submit">Create account</button>
    </form>

    <p class="auth-alt">Already have an account? <a href="/login">Log in</a></p>
</section>
{% endblock %}
