# Local production-like stack: Halation + Postgres.
# Usage: docker compose up --build
#
# For real deployments, set HALATION_SESSION_SIGNING_KEY in your
# environment (64+ random bytes) and swap storage backend to R2 via:
#   APP_STORAGE__BACKEND=s3
#   APP_STORAGE__R2__BUCKET / __ENDPOINT / __ACCESS_KEY / __SECRET_KEY
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - halation_pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENVIRONMENT: production
      APP_APPLICATION__HOST: 0.0.0.0
      APP_APPLICATION__PORT: "8000"
      APP_DATABASE__HOST: db
      APP_DATABASE__PORT: "5432"
      APP_DATABASE__USERNAME: postgres
      APP_DATABASE__PASSWORD: password
      APP_DATABASE__DATABASE_NAME: halation
      # Internal compose network has no TLS termination on Postgres
      APP_DATABASE__REQUIRE_SSL: "false"
      APP_SECRETS__SESSION_SIGNING_KEY: ${HALATION_SESSION_SIGNING_KEY:-dev-only-compose-key-0123456789abcdef0123456789abcdef0123456789abcdef}
      APP_STORAGE__BACKEND: memory
      APP_GEOCODE__ENABLED: "true"
    ports:
      - "8000:8000"

volumes:
  halation_pg_data:
